plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.alfonsobries.exponativeemojipicker'
version = '0.1.0'

android {
  namespace 'expo.modules.nativeemojipicker'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.core:core-ktx:1.13.1'
  // Google's own emoji picker: the component Android apps use, with
  // categories, recents and skin-tone variants already solved.
  implementation 'androidx.emoji2:emoji2-emojipicker:1.6.0'
}
